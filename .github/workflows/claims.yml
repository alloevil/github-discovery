name: claims

# Runs the receipts behind claims.json: every published number must still be printed by
# the command next to it. The weekly run exists because data moves without anyone
# committing — that is exactly how a published figure goes stale.
on:
  push:
  pull_request:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  verify:
    name: published numbers still reproduce
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      # 一条收据（test-count）跑 pytest 的收集器来核对 roadmap 里写的测试数，
      # 所以这个 job 需要 runner。它在 CI 第一次跑就红了 —— 正是收据该有的表现。
      - name: Install the test runner the receipts use
        run: pip install --quiet pytest
      - uses: alloevil/verify-claims@v0.1.1
        with:
          strict: "true"
